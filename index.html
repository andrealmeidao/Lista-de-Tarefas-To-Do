<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista com API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Lista de Tarefas</h1>

    <input type="text" id="inputTarefa" placeholder="Digite uma tarefa">
    <button id="botaoAdicionar">Adicionar</button>

    <ul id="listaTarefas"></ul>
    <p id="contadorTarefas">Tarefas: 0</p>
    <p id="contadorConcluidas">Concluídas: 0</p>
    <div class="barra-container">
    <div id="barraProgresso"></div>
</div>
  </div>


  <script src="script.js"></script>
</body>
</html>
